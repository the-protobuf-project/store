syntax = "proto3";

// Package strictdep.v1 is annotated entirely in the deprecated orm.v1
// vocabulary. Generation succeeds — that is the compatibility promise — but the
// compat reader is marked schema.DeprecatedStructure, so protokit files one
// "lint" diagnostic per deprecated option, which --strict lint:error promotes to
// a hard failure. That is how a team turns "migrate eventually" into a build gate.
package strictdep.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "orm/v1/annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "SchemaProto";
option java_package = "com.strictdep.v1";
option (orm.v1.datasource) = {
  database: "strictdep_db"
  provider: "postgres"
  schema: "public"
};

// Relic uses the deprecated structural options: table.id and table.timestamps
// both moved to protokit.v1.table.
message Relic {
  option (google.api.resource) = {
    type: "strictdep.v1/Relic"
    pattern: "relics/{relic}"
    singular: "relic"
    plural: "relics"
  };
  option (orm.v1.table) = {
    id: ID_STRATEGY_ULID
    timestamps: true
  };

  // name: IDENTIFIER → demoted to a UNIQUE lookup column by the ULID strategy.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // label uses the deprecated column.skip, which moved to protokit.v1.column.
  string label = 2 [(orm.v1.column) = {skip: true}];

  // note uses a deprecated *storage* option. It moved to store.v1.column, which
  // protokit cannot warn about itself — the plugin reports that half separately.
  string note = 3 [(orm.v1.column) = {type: "TEXT"}];
}
