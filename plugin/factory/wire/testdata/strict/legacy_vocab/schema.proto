syntax = "proto3";

// Package legacyvocab.v1 is a schema written entirely in the pre-split orm.v1
// vocabulary, as it would have been before entity.v1 existed. Nothing in it has
// been migrated.
//
// It exists to pin the compatibility contract: a proto like this still generates,
// with its structure intact, and says so with a lint diagnostic rather than
// silently. The structure is what makes the test meaningful — if the compat
// reader stopped working, the annotations here would simply be ignored, the build
// would still succeed, and the tables would quietly come out with no timestamps,
// no ULID key, and the wrong names. That is the failure this case is aimed at, and
// it is invisible without an assertion.
//
// testdata/strict/legacy_vocab_twin is this file migrated to entity.v1, and
// TestLegacyVocabularyEquivalence requires the two to generate byte-identical
// output. That is why the doc comments below describe the schema and never the
// vocabulary: a leading comment is forwarded into the generated output as a
// COMMENT ON statement, so prose mentioning "orm.v1" here would show up as a
// difference between the twins and mask a real one. Vocabulary-specific notes go
// in this package comment, which is not forwarded, or inside the message body.
package legacyvocab.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "orm/v1/annotations.proto";

option (orm.v1.datasource) = {
  database: "legacy_db"
  provider: "postgres"
  schema: "legacy"
};

// Widget is a labelled thing with a surrogate key and audit timestamps.
message Widget {
  option (google.api.resource) = {
    type: "legacyvocab.v1/Widget"
    pattern: "widgets/{widget}"
    plural: "widgets"
    singular: "widget"
  };
  // Table name, key strategy, timestamps and indexes — every one of them neutral
  // structure that entity.v1 owns now, declared here in the vocabulary that used
  // to own all of it.
  option (orm.v1.table) = {
    table: "legacy_widgets"
    id: ID_STRATEGY_ULID
    timestamps: true
    indexes: [{
      columns: ["display_label"]
      unique: true
      index: "idx_widget_label"
    }]
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-readable label for the widget.
  string label = 2 [(orm.v1.column) = {column: "display_label"}];

  // Bookkeeping the database has no use for.
  string internal = 3 [(orm.v1.column) = {skip: true}];
}
