syntax = "proto3";

// Package reserved.v1 exercises SQL-reserved-word identifier quoting: the table
// name and several columns collide with reserved words (user, order, select),
// which must emit as quoted identifiers to produce valid DDL.
package reserved.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "entity/v1/annotations.proto";
import "store/v1/annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "ReservedWordsProto";
option java_package = "com.reserved.v1";
option (entity.v1.datasource) = {
  database: "reserved_db"
  provider: "postgres"
  schema: "public"
};

// Account is forced onto the reserved table name "user" via a table override,
// with reserved-word columns, a composite UNIQUE index over them, and
// column-level index requests both covered and uncovered by that composite.
message Account {
  option (google.api.resource) = {
    type: "reserved.v1/Account"
    pattern: "accounts/{account}"
    singular: "account"
    plural: "accounts"
  };
  option (entity.v1.table) = {
    table: "user"
    indexes: [
      {
        columns: [
          "order",
          "select"
        ]
        unique: true
      }
    ]
  };

  // name: IDENTIFIER → PRIMARY KEY.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // order is a reserved word. Its single-column index request is redundant —
  // order already leads the composite UNIQUE above, whose B-tree serves the
  // same single-column lookups — so no separate index is emitted for it.
  string order = 2 [(store.v1.column) = {index: true}];

  // select is a reserved word.
  string select = 3;

  // grant is a reserved word carrying a single-column index no composite
  // covers, so one is emitted — with both the column and the generated index
  // name quoted.
  string grant = 5 [(store.v1.column) = {index: true}];

  // state exercises a quoted, schema-qualified enum type reference.
  State state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// State is the account lifecycle state.
enum State {
  // STATE_UNSPECIFIED is the zero value; the account state is unset.
  STATE_UNSPECIFIED = 0;

  // STATE_ACTIVE marks an open, usable account.
  STATE_ACTIVE = 1;

  // STATE_CLOSED marks a deactivated account.
  STATE_CLOSED = 2;
}
