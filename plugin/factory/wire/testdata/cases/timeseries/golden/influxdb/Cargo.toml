# Code generated by protoc-gen-store. DO NOT EDIT.
# versions:
# 	protoc-gen-store (unknown)
# 	protoc (unknown)
#
# The crate of every generated time-series store.
# annotations: entity.v1 (unknown), store.v1 (unknown)
# engine:      protokit (unknown)
# runtime:     tpp-database
#
# store — https://github.com/the-protobuf-project/store
[package]
name = "generated"
version = "0.1.0"
edition = "2024"
publish = false
description = "Time-series stores generated by protoc-gen-store for InfluxDB 3 and Arrow captures."

# The tree is one crate, as gorm's output is one Go module: lib.rs at the root,
# one module directory per database beside the shared seriesx runtime.
[lib]
path = "lib.rs"

# Redirect to a local checkout without editing this file:
#   [patch."https://github.com/the-protobuf-project/runtime-rs"]
#   tpp-database = { path = "../runtime-rs/database" }
[dependencies]
tpp-database = { git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main" }
