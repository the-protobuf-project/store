syntax = "proto3";

// Package mixed.v1 carries both vocabularies on the same nodes, which is what a
// half-finished migration looks like. protokit.v1 is authoritative wherever the
// two disagree, and protokit files a "lint" diagnostic naming the orm.v1 value
// it ignored — the drift that would otherwise make a schema stop meaning what it
// appears to say.
//
// The golden output is the assertion: every name here comes from protokit.v1,
// never from the orm.v1 value sitting beside it.
package mixed.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "orm/v1/annotations.proto";
import "protokit/v1/annotations.proto";
import "store/v1/annotations.proto";

option java_multiple_files = true;
option java_outer_classname = "MixedProto";
option java_package = "com.mixed.v1";
// Both set the database and schema. protokit.v1 wins: the output tree is
// mixed_db/store, never legacy_db/legacy.
option (orm.v1.datasource) = {
  database: "legacy_db"
  provider: "postgres"
  schema: "legacy"
};
option (protokit.v1.datasource) = {
  database: "mixed_db"
  provider: "postgres"
  schema: "store"
};

// Widget sets the table name and timestamps in both vocabularies.
message Widget {
  option (google.api.resource) = {
    type: "mixed.v1/Widget"
    pattern: "widgets/{widget}"
    singular: "widget"
    plural: "widgets"
  };
  option (orm.v1.table) = {
    table: "legacy_widgets"
    timestamps: false
  };
  option (protokit.v1.table) = {
    table: "widgets"
    timestamps: true
  };

  // name: IDENTIFIER → PRIMARY KEY.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // label renames the column in both vocabularies; protokit.v1 wins ("label").
  string label = 2 [
    (orm.v1.column) = {column: "legacy_label"},
    (protokit.v1.column) = {column: "label"}
  ];

  // note carries only storage options, and only in store.v1 — the migrated
  // spelling. Its orm.v1 twin below is on a different field so both paths are
  // exercised in one case.
  string note = 3 [(store.v1.column) = {type: "TEXT"}];

  // legacy_note is still on orm.v1 storage: the compat fallback must resolve it
  // to the same TEXT column store.v1 would have produced.
  string legacy_note = 4 [(orm.v1.column) = {type: "TEXT"}];
}
