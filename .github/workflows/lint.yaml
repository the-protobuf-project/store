name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store
        uses: actions/checkout@v7
        with:
          path: store

      - name: Checkout telemetry (for the telemetry-go replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/telemetry
          path: telemetry

      - name: Checkout runtime-go (for the runtime-go/telemetry replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/runtime-go
          path: runtime-go

      - uses: actions/setup-go@v7
        with:
          go-version-file: store/go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: store

  proto:
    name: Lint (Proto)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store
        uses: actions/checkout@v7
        with:
          path: store

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: buf build
        working-directory: store
        run: buf build

      - name: buf lint
        working-directory: store
        run: buf lint

      - name: Generated stubs up to date
        working-directory: store
        run: |
          buf generate
          # Both trees: one `buf generate` writes store.v1's stubs to plugin/pb/
          # and entity.v1's to plugin/entity/pb/. Gating only the former would let
          # a stale copy of the vocabulary every other plugin agrees on reach the
          # BSR.
          git diff --exit-code -- plugin/pb/ plugin/entity/pb/ \
            || (echo "::error::generated stubs are stale — run 'buf generate' and commit" && exit 1)
