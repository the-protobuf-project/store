name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout store
        uses: actions/checkout@v7
        with:
          path: store

      # store/go.mod has local `replace` directives for
      # telemetry-go (telemetry.v1's Go stubs, pending a BSR/module
      # publish), runtime-go/telemetry (the Meter contract generated code
      # binds to, not published yet either), and protokit (whose removal of
      # protokit.v1 — the change that moved entity.v1 here — is unreleased) —
      # all point at ../<repo> relative to store, so CI checks them out as true
      # siblings, matching local development. Drop each checkout (and go.mod's
      # replace) as the corresponding module is published for real.
      - name: Checkout telemetry (for the telemetry-go replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/telemetry
          path: telemetry

      - name: Checkout runtime-go (for the runtime-go/telemetry replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/runtime-go
          path: runtime-go

      - name: Checkout protokit (for the protokit replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/protokit
          path: protokit

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: store/go.mod

      - name: Download dependencies
        working-directory: store
        run: go mod download

      # plugin/entity/ is part of the root module, so ./... reaches its tests.
      - name: Test
        working-directory: store
        run: go test -race ./...

  # The examples module: the committed generated code compiled and vetted, and
  # its tests run against a real Postgres and OpenSearch. The search and
  # references tests skip without STORE_TEST_POSTGRES_DSN and
  # STORE_TEST_OPENSEARCH_URL, which is how an OpenSearch-only failure went
  # unnoticed before this job.
  examples:
    name: Examples (Go, Postgres + OpenSearch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
        options: >-
          --health-cmd "curl -sf http://localhost:9200"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: examples/go.mod
          cache-dependency-path: examples/go.sum
      - name: Vet and test against Postgres and OpenSearch
        working-directory: examples
        env:
          GOWORK: 'off'
          STORE_TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres dbname=postgres sslmode=disable
          STORE_TEST_OPENSEARCH_URL: http://localhost:9200
        run: |
          go vet ./...
          go test -count=1 ./...

  # The Rust repositories lang=rust target=repository generates, compiled and
  # run against the runtime-rs commit the example pins: descriptors checked
  # against the sql target's DDL, and round trips through RecordsRepository on
  # SQLite. Its generated sources are committed, and the Go goldens hold them to
  # the generator.
  rust-library:
    name: Rust repositories (library example)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/library-rust

      - name: Format
        working-directory: examples/library-rust
        run: cargo fmt --check

      - name: Lint
        working-directory: examples/library-rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: examples/library-rust
        run: cargo test --locked

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout store
        uses: actions/checkout@v7
        with:
          path: store

      - name: Checkout telemetry (for the telemetry-go replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/telemetry
          path: telemetry

      - name: Checkout runtime-go (for the runtime-go/telemetry replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/runtime-go
          path: runtime-go

      - name: Checkout protokit (for the protokit replace)
        uses: actions/checkout@v7
        with:
          repository: the-protobuf-project/protokit
          path: protokit

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: store/go.mod

      - name: Build plugin binary
        working-directory: store
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags "-s -w" -o /dev/null ./plugin/cmd/protoc-gen-store
