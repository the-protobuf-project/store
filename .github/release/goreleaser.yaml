version: 2
project_name: protoc-gen-store

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: protoc-gen-store
    binary: protoc-gen-store
    main: ./plugin/cmd/protoc-gen-store
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: protoc-gen-store-archive
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}amd64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo

# Homebrew cask, generated and committed to the tap on each release. The url +
# sha256 for every platform are filled in automatically from the archives below,
# so there is no checksum to hand-maintain (this is what makes the removed,
# hand-written Formula/protoc-gen-store.rb redundant).
homebrew_casks:
  - name: protoc-gen-store
    repository:
      owner: the-protobuf-project
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/the-protobuf-project/store'
    description: 'Protoc plugin generating Prisma, GORM & SQL schemas from Protobuf + AIP annotations'
    ids:
      - protoc-gen-store-archive
    binaries:
      - protoc-gen-store
    url:
      verified: 'github.com/the-protobuf-project/store/'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/protoc-gen-store"]
          end

  # The pre-rename cask token, kept for one major so `brew upgrade` keeps working
  # for anyone who installed protoc-gen-orm. goreleaser's cask schema has no alias
  # field, so this is a second cask over the *same* archives — the checksums are
  # filled in from the same build, and there is nothing to keep in step by hand.
  # It installs the renamed binary, because that is what the archive contains.
  # Delete this entry when orm.v1 goes.
  - name: protoc-gen-orm
    repository:
      owner: the-protobuf-project
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Casks
    homepage: 'https://github.com/the-protobuf-project/store'
    description: 'Deprecated alias for protoc-gen-store — install that instead'
    ids:
      - protoc-gen-store-archive
    binaries:
      - protoc-gen-store
    url:
      verified: 'github.com/the-protobuf-project/store/'
    # Installing both would fight over the same binary in the same prefix.
    conflicts:
      - cask: protoc-gen-store
    caveats: |
      protoc-gen-orm has been renamed to protoc-gen-store. This cask is an alias
      kept for one major release and installs the protoc-gen-store binary.

      Switch with:
        brew uninstall --cask protoc-gen-orm
        brew install the-protobuf-project/tap/protoc-gen-store
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/protoc-gen-store"]
          end

release:
  github:
    owner: the-protobuf-project
    name: orm
  draft: false
  prerelease: auto
  name_template: 'v{{.Version}}'
  header: |
    ## What's New in v{{.Version}}

    `protoc-gen-store` generates Prisma, GORM, and SQL database schemas
    from your Protobuf definitions. Download the binary for your platform below.

    ### Installation

    #### Homebrew
    ```bash
    brew install the-protobuf-project/tap/protoc-gen-store
    ```

    #### Manual (macOS / Linux)
    ```bash
    # Pick your platform, e.g. darwin_arm64 / linux_amd64
    curl -LO https://github.com/the-protobuf-project/store/releases/download/v{{.Version}}/protoc-gen-store_{{.Version}}_darwin_arm64.tar.gz
    tar -xzf protoc-gen-store_{{.Version}}_darwin_arm64.tar.gz
    sudo mv protoc-gen-store /usr/local/bin/
    ```

    Then reference it from `buf.gen.yaml`:
    ```yaml
    plugins:
      - local: protoc-gen-store
        out: generated
        opt: [target=prisma]   # prisma | gorm | sql
    ```
