# What protoc-gen-store is, declared for anything that has to compose plugins.
#
# protokit's manifest package parses and validates this file; it deliberately
# resolves nothing — no module is fetched, no constraint is compared against a
# real version. So this is useful for exactly two things today: telling a human
# what the plugin expects, and failing fast when that declaration contradicts
# itself. Whatever eventually schedules a multi-plugin run reads it later.
#
# Decoding is strict: an unknown key is an error, not a silently ignored line.

# The vocabulary this plugin owns and the key its FacetReader registers under.
provides: store

# store cannot run on its own: protokit builds the neutral structure (databases,
# schemas, tables, columns) that everything here is layered on. It reads no
# vocabulary itself — entity.v1 arrives through the reader this plugin registers.
requires:
  - protokit

# Proto modules and the versions of them this plugin needs.
#   entity    — entity.v1 structure options: the neutral vocabulary every
#               protokit plugin shares. Published from this repository, but
#               versioned separately from the plugin that ships it.
#   store     — this plugin's own storage options.
annotations:
  buf.build/the-protobuf-project/entity: '^1'
  buf.build/the-protobuf-project/store: '^1'

# A property of what the plugin *emits*, not of what builds it: the generated
# Go must compile on this toolchain. Bumped only when generated code starts
# using a newer language or stdlib feature.
runtime:
  go: '>=1.26'

facets:
  # entity.v1 is not listed: it is not a facet. It is structure protokit folds
  # into the IR during the build, so there is nothing to read back per node.
  # The criterion is what this plugin reads back out of the IR per node, not who
  # registered the reader that put it there.
  #
  # entity.v1 is therefore absent, despite being indispensable: this plugin
  # registers entity.Reader() and depends utterly on it, but consumes it through
  # the reader's *structure* half, which protokit folds into databases, schemas,
  # tables and columns during the build. Nothing here ever asks for an entity.v1
  # facet by node. The hard dependency on that vocabulary is real and is declared
  # where it belongs, under annotations: above.
  reads: []

  # telemetry.v1 tunes the instrumentation woven into the generated stores, and
  # is read back per node — see telemetry.Set. Optional because a build without it
  # generates uninstrumented output: less, not broken.
  #
  # store.v1 is read back per node too, but is absent for a third reason: this
  # plugin provides it, so declaring a dependency on it would say nothing.
  optional_reads:
    - telemetry.v1

# The footprint, relative to the plugin's output directory. Enough for a
# scheduler to spot two plugins that would write the same path.
outputs:
  - '**/*.go'
  - '**/*.sql'
  - '**/*.prisma'
  - '**/*.ts'
  - '**/README.md'
