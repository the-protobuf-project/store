# Code generated by protoc-gen-store. DO NOT EDIT.
# versions:
# 	protoc-gen-store dev
# 	protoc (unknown)
#
# The crate of every generated Rust repository.
# annotations: entity.v1 dev, store.v1 dev
# engine:      protokit v1.4.0
# runtime:     tpp-database
#
# store — https://github.com/the-protobuf-project/store
[package]
name = "library"
version = "0.1.0"
edition = "2024"
publish = false
description = "Repositories generated by protoc-gen-store over the tpp-database records runtime."

# The tree is one crate, as the influxdb target's is: lib.rs at the root, one
# module per proto package. Its code names the prost messages through
# crate::pb, so either the crate holds that module or, more often, the
# tree is mounted into the crate that does:
#   #[path = "<out>/lib.rs"] pub mod repository;
[lib]
path = "lib.rs"

# Redirect to a local checkout without editing this file:
#   [patch."https://github.com/the-protobuf-project/runtime-rs"]
#   tpp-database = { path = "../runtime-rs/database" }
[dependencies]
tpp-database = { git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main" }
prost = "0.14"
prost-reflect = "0.16"
