syntax = "proto3";

// Package refdemo.lending.v1 is the referring side of the references example,
// in the "lending" database: a loan names a catalog book (another database on
// the same server: a real foreign key) and a borrower's card (another service
// entirely: a reference hook).
package refdemo.lending.v1;

import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/the-protobuf-project/store/examples/generated/go/protobuf/references/lendingv1;lendingv1";
option java_multiple_files = true;
option java_outer_classname = "LendingProto";
option java_package = "com.refdemo.lending.v1";

// A loan of a book to a borrower.
message Loan {
  option (google.api.resource) = {
    type: "lending.example.com/Loan"
    pattern: "loans/{loan}"
    singular: "loan"
    plural: "loans"
  };
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // The loan's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The book lent. Same server, other database: a foreign key.
  string book = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "catalog.example.com/Book"}
  ];

  // The borrower's card, owned by another service: no foreign key reaches
  // it, so writes resolve it with its AIP Get and its deletes ask us.
  string borrower = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "vcard.example.com/Card"},
    (store.v1.reference) = {on_delete: ON_DELETE_RESTRICT}
  ];

  // Who to tell when a card is deleted; NOTIFY policy.
  string guarantor = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "vcard.example.com/Card"},
    (store.v1.reference) = {on_delete: ON_DELETE_NOTIFY}
  ];

  // Server-owned state, written with UpdateWithOutputOnly.
  string state = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Optimistic-concurrency token.
  string etag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the loan was soft-deleted.
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the soft-deleted loan goes for good.
  google.protobuf.Timestamp expire_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}
