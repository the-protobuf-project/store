syntax = "proto3";

// Package refdemo.catalog.v1 is the referenced side of the references
// example: shelves and the books on them, in the "catalog" database.
package refdemo.catalog.v1;

import "entity/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/the-protobuf-project/store/examples/generated/go/protobuf/references/catalogv1;catalogv1";
option java_multiple_files = true;
option java_outer_classname = "CatalogProto";
option java_package = "com.refdemo.catalog.v1";

// A shelf holds books.
message Shelf {
  option (google.api.resource) = {
    type: "catalog.example.com/Shelf"
    pattern: "shelves/{shelf}"
    singular: "shelf"
    plural: "shelves"
  };
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // The shelf's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A label for people.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Optimistic-concurrency token.
  string etag = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the shelf was soft-deleted.
  google.protobuf.Timestamp delete_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the soft-deleted shelf goes for good.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Books on show, of this shelf or another: a repeated reference to a
  // nested resource, kept in a join table with each book's full name.
  repeated string featured = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Book"}
  ];
}

// A book on a shelf: a nested resource, so a reference to it stores its full
// name and a foreign key to it targets its name column.
message Book {
  option (google.api.resource) = {
    type: "catalog.example.com/Book"
    pattern: "shelves/{shelf}/books/{book}"
    singular: "book"
    plural: "books"
  };
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // The book's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The title.
  string title = 2 [(google.api.field_behavior) = REQUIRED];

  // Optimistic-concurrency token.
  string etag = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the book was soft-deleted.
  google.protobuf.Timestamp delete_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the soft-deleted book goes for good.
  google.protobuf.Timestamp expire_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Shelves the book is also filed under: a repeated reference to a
  // top-level resource, kept in a join table by the shelves' ids.
  repeated string filed_under = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Shelf"}
  ];

  // The book's genres: a repeated reference to a resource deleted outright
  // (no soft delete), which a delete refuses while a book names it.
  repeated string genres = 7 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Genre"}
  ];

  // The genre the book is shelved by: an optional reference to a resource
  // deleted outright, which takes no action, so a delete refuses while a
  // book names it.
  string primary_genre = 8 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Genre"}
  ];

  // A genre the book was once classed under: an optional reference that
  // says SET_NULL, so deleting the genre blanks it.
  string former_genre = 9 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Genre"},
    (store.v1.column).on_delete = REFERENTIAL_ACTION_SET_NULL
  ];

  // The shelf the book goes back to: an optional reference to a
  // soft-deleted resource, which keeps a purged shelf while a book names it.
  string returns_to = 10 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "catalog.example.com/Shelf"}
  ];
}

// A genre books are classed under: deleted outright, with no soft delete.
message Genre {
  option (google.api.resource) = {
    type: "catalog.example.com/Genre"
    pattern: "genres/{genre}"
    singular: "genre"
    plural: "genres"
  };
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // The genre's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The genre as it is shown.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];
}

// A page of a book: nested two deep, so the row it hangs off is a nested
// resource's, found by its name.
message Page {
  option (google.api.resource) = {
    type: "catalog.example.com/Page"
    pattern: "shelves/{shelf}/books/{book}/pages/{page}"
    singular: "page"
    plural: "pages"
  };
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  // The page's resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // What is printed on it.
  string text = 2;
}
