# The library example: the Rust repositories generated by lang=rust
# target=repository (examples/generated/rust/repository/library), mounted beside
# the prost messages they name (crate::pb) and checked on SQLite against the
# DDL the sql target renders from the same protos.
# Run: just test-library   (or: cargo test)
[package]
name = "library-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The runtime the generated repositories are written against: RecordsRepository,
# Rules (pattern, parent_column, references) and Column.labels landed in
# runtime-rs#49. Pinned to that merge, as protoc-gen-service pins runtime-rs.
tpp-database = { git = "https://github.com/the-protobuf-project/runtime-rs", rev = "53f2ffbfefc2caa2c02ba4d62637ede614103b17", default-features = false, features = ["orm-sqlite"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
