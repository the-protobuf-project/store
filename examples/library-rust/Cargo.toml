# The library example: the Rust repositories generated by lang=rust
# target=repository (examples/generated/rust/repository/library), mounted beside
# the prost messages they name (crate::pb) and checked on SQLite against the
# DDL the sql target renders from the same protos.
# Run: just test-library   (or: cargo test)
[package]
name = "library-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Local verification against a runtime-rs checkout beside this repository.
# It needs RecordsRepository implemented with Rules.pattern / parent_column /
# references and Column.labels (runtime-rs branch feat/repository-impl). CI pins
# the git dependency instead, once that is on main:
#   tpp-database = { git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main", features = ["orm-sqlite"] }
tpp-database = { path = "../../../runtime/runtime-rs-repository/database", default-features = false, features = ["orm-sqlite"] }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
