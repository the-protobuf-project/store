version: v2

# Generates store's database targets from the bookstore example protos.
# Run: buf generate --template buf.gen.example.yaml
#
# Output layout mirrors the hand-written schema/ tree:
#   prisma/<db>/schema.prisma + <db>/<schema>/<domain>.postgres.prisma
#   gorm/<db>/<schemapkg>/models.go + gorm/<db>/migrate.go (factory registry)
#   sql/<db>/<schema>.postgres.sql + sql/<db>/migrate.sql (consolidated)
#
# The M entries supply the Go import-path mapping protogen requires for every
# .proto it processes, so example protos don't need `option go_package`.
inputs:
  - directory: examples/proto

plugins:
  - local: protoc-gen-store
    out: examples/generated/prisma
    opt:
      - target=prisma
      - Mbookstore/v1/bookstore.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1
      - Mbookstore/v1/inventory.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1

  - local: protoc-gen-store
    out: examples/generated/gorm
    opt:
      - target=gorm
      # go_module is the import path of the gorm out: directory, so the generated
      # migration aggregator can import each per-schema models package.
      - go_module=github.com/the-protobuf-project/store/examples/generated/gorm
      # stores emits a typed CRUD store per resource (one <model>_store.go file);
      # it adds a gorm.io/gorm dependency to each generated models package.
      - stores=true
      # telemetry folds first-party telemetry instrumentation into the
      # stores, an ormtelemetry adapter/plugin package, and Registry.Instrument;
      # it adds a github.com/the-protobuf-project/telemetry/telemetry-go
      # dependency.
      - telemetry=true
      # filters emits AIP-160 filter / AIP-132 order_by specs per schema
      # (filters.go) plus the shared filterx engine package serving both SQL
      # (GORM) and Hasura DDN GraphQL. The Hasura engine adds a
      # github.com/the-protobuf-project/runtime-go dependency; with telemetry
      # above it also emits filterx.TelemetryObserver.
      - filters=true
      - Mbookstore/v1/bookstore.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1
      - Mbookstore/v1/inventory.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1

  - local: protoc-gen-store
    out: examples/generated/sql
    opt:
      - target=sql
      - Mbookstore/v1/bookstore.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1
      - Mbookstore/v1/inventory.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1

  # The graphql target renders a typed Go client from a GraphQL schema, not from
  # the .proto input above — it reads examples/graphql/store.yaml (the config=
  # opt) for its schema, dialect, package and go_module. The committed SDL keeps
  # this offline and reproducible; see that file for the endpoint alternative.
  - local: protoc-gen-store
    out: examples/generated/graphql
    opt:
      - target=graphql
      - config=examples/graphql/store.yaml
      # buf hands the .proto input to every plugin entry, and protogen refuses to
      # start without an import path for each file — even though this target
      # renders from the GraphQL schema and reads none of them.
      - Mbookstore/v1/bookstore.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1
      - Mbookstore/v1/inventory.proto=github.com/the-protobuf-project/store/examples/gen/bookstore/v1
