syntax = "proto3";

package orm.v1;

import "google/protobuf/descriptor.proto";
import "orm/v1/cache.proto";
import "orm/v1/column.proto";
import "orm/v1/constraint.proto";
import "orm/v1/datasource.proto";
import "orm/v1/query.proto";
import "orm/v1/table.proto";
import "orm/v1/validate.proto";

option go_package = "github.com/the-protobuf-project/orm/plugin/pb/ormpbv1;ormpbv1";
option java_multiple_files = true;
option java_outer_classname = "AnnotationsProto";
option java_package = "com.orm.v1";

// annotations.proto is the single import an orm schema author needs:
//
//	import "orm/v1/annotations.proto";
//
// It is self-contained — grouping (datasource), model structure (table names,
// id/timestamp synthesis), and database rendering (types, sizing, indexes) all
// live under orm.v1, so a user annotates entirely with orm.v1.* and imports
// nothing else. Field numbers 50000-99999 are reserved for non-Google options.
//
// Telemetry annotations are not part of orm.v1 — they live in the standalone
// telemetry.v1 module (see telemetry/v1/annotations.proto) so any codegen
// target, not just orm's gorm target, can read them. Annotate with
// (telemetry.v1.telemetry) / (telemetry.v1.telemetry_field) directly; orm.v1
// carries no telemetry extensions of its own (no back-compat aliases either
// — there was never a released consumer of the old orm.v1.telemetry* fields
// to keep compiling).

extend google.protobuf.FileOptions {
  // datasource groups the file's messages into a database and names its schema.
  DatasourceOptions datasource = 50000;
}

extend google.protobuf.MessageOptions {
  // table overrides table-level generation: name, id strategy, timestamps, indexes.
  TableOptions table = 50001;

  // cache declares the table's caching policy: which key sets are cached, for
  // how long, where, and what invalidates them.
  CacheOptions cache = 50005;

  // table_constraint declares a CHECK spanning several columns, which the
  // field-level (orm.v1.constraint) cannot express. Repeated: a table may carry
  // as many as it needs.
  repeated TableConstraint table_constraint = 50007;
}

extend google.protobuf.FieldOptions {
  // column overrides column-level generation: name, type, sizing, FK actions.
  ColumnOptions column = 50002;

  // query tunes the field's generated list-query surface: AIP-160 filter,
  // AIP-132 order_by, and free-text search.
  QueryOptions query = 50003;

  // validate applies parameterless validation presets to the field. Repeated
  // and stacked at the call site, in the style of google.api.field_behavior;
  // presence and mutability stay with field_behavior itself.
  repeated Validate validate = 50004;

  // constraint carries the validation rules that take an argument — bounds,
  // lengths, patterns, value sets — which a stackable enum cannot express.
  ConstraintOptions constraint = 50006;
}
