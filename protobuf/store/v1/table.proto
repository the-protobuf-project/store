syntax = "proto3";

package store.v1;

option go_package = "github.com/the-protobuf-project/store/plugin/pb/storepbv1;storepbv1";
option java_multiple_files = true;
option java_outer_classname = "TableProto";
option java_package = "com.store.v1";

// TableOptions overrides how a message's table is *stored*.
//
// The table's name, whether it is emitted, its key strategy, its timestamps, and
// its composite indexes are neutral structure and live in (entity.v1.table),
// which every plugin reads through the same shared reader. What remains here is
// storage a name cannot express.
//
// Applied via:
//
//	option (store.v1.table) = {outbox: true};
message TableOptions {
  // outbox emits a companion outbox table beside this resource: the durable
  // hand-off point for change events, written in the same transaction as the
  // row it describes.
  //
  // Only the table is generated — no publisher, no store, no dispatch loop.
  // Owning the table is this plugin's job because an outbox *is* a table; who
  // drains it is not. A streams generator emits the publisher against this
  // schema, and does so without needing to edit anything in this tree.
  //
  // Off by default.
  bool outbox = 1;

  // no_overlap forbids two rows that agree on `key` from covering overlapping
  // time, enforced by the database itself rather than by whoever writes.
  //
  // A booking table is the case it exists for: "no two allocations of one
  // resource may overlap" is a check-then-insert race in application code, and
  // a lock that every writer has to remember to take. Declared here, it is a
  // PostgreSQL exclusion constraint -- EXCLUDE USING gist (key WITH =,
  // tstzrange(start, end, '[)') WITH &&) -- which settles the race in the one
  // place every writer passes through. A write that would overlap fails with
  // SQLSTATE 23P01, which the generated repositories report as a conflict.
  // A generated trigger has writers of one key take turns (an advisory lock
  // before each insert), so racing writers fail cleanly rather than deadlock.
  //
  // Ranges are half-open, so back-to-back rows (one ending as the next begins)
  // do not overlap.
  //
  // Applied via:
  //
  //	option (store.v1.table) = {
  //	  no_overlap: {key: ["resource"], start: "start_time", end: "end_time"}
  //	};
  repeated NoOverlap no_overlap = 2;

  // time_series makes this message a measurement: a stream of points, each
  // identified by its tag set and its time, rather than a row identified by a
  // key. It is what the rust target renders — InfluxDB 3 and Arrow IPC
  // captures through the tpp-database runtime — and only messages declaring it
  // are rendered there.
  //
  // Every field that is neither the time nor a tag is a stored value. All of
  // them must be scalars without explicit presence: a point is written whole,
  // and neither backend stores a null.
  //
  // Applied via:
  //
  //	option (store.v1.table) = {
  //	  time_series: {time: "observe_time", tags: ["device", "site"]}
  //	};
  TimeSeries time_series = 3;
}

// TimeSeries names the fields that identify a point.
message TimeSeries {
  // time is the field holding the observation time: a
  // google.protobuf.Timestamp, or an int64 of epoch nanoseconds.
  string time = 1;

  // tags lists the string fields (proto snake_case) forming the series
  // identity, e.g. ["device", "site"]. Writing a point whose tags and time
  // match an existing one replaces its values. May be empty.
  repeated string tags = 2;
}

// NoOverlap is one exclusion rule over a table's time ranges.
message NoOverlap {
  // key lists the fields (proto snake_case) rows must share to conflict, e.g.
  // ["resource"]. Empty means every row conflicts with every other.
  repeated string key = 1;

  // start is the google.protobuf.Timestamp field where a row's range begins,
  // inclusive.
  string start = 2;

  // end is the google.protobuf.Timestamp field where it ends, exclusive.
  string end = 3;

  // constraint is the constraint's name. Generated as
  // <table>_<key...>_no_overlap when empty.
  string constraint = 4;
}
