version: v2

# Generates examples/search: a (store.v1.projection) maintained by the
# repositories and searched on Postgres, and the same projection indexed in
# OpenSearch (target=opensearch).
#
# Run (with the dev plugin first on PATH): just search
inputs:
  - directory: examples/search/proto

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: examples/generated/go/protobuf/search
    opt:
      - module=github.com/the-protobuf-project/store/examples/generated/go/protobuf/search

  - local: protoc-gen-store
    out: examples/generated/go/gorm/search
    strategy: all
    opt:
      - target=gorm
      - stores=true
      - converters=true
      - filters=true
      - go_module=github.com/the-protobuf-project/store/examples/generated/go/gorm/search
      - config=examples/search/store.yaml

  - local: protoc-gen-store
    out: examples/generated/go/repository/search
    strategy: all
    opt:
      - target=repository
      - go_module=github.com/the-protobuf-project/store/examples/generated/go/repository/search
      - gorm_module=github.com/the-protobuf-project/store/examples/generated/go/gorm/search
      - config=examples/search/store.yaml

  - local: protoc-gen-store
    out: examples/generated/sql/search
    strategy: all
    opt:
      - target=sql
      - config=examples/search/store.yaml

  - local: protoc-gen-store
    out: examples/generated/go/opensearch/search
    strategy: all
    opt:
      - target=opensearch
      - go_module=github.com/the-protobuf-project/store/examples/generated/go/opensearch/search
      - gorm_module=github.com/the-protobuf-project/store/examples/generated/go/gorm/search
      - repository_module=github.com/the-protobuf-project/store/examples/generated/go/repository/search
      - config=examples/search/store.yaml
