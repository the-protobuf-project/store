version: v2

# Generates examples/references: the reference contract end to end. Two
# databases on one server with a cross-database foreign key, and a reference
# to a resource of another service checked through its AIP Get.
#
# Run (with the dev plugin first on PATH): just references
inputs:
  - directory: examples/references/proto

plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: examples/generated/go/protobuf/references
    opt:
      - module=github.com/the-protobuf-project/store/examples/generated/go/protobuf/references

  - local: protoc-gen-store
    out: examples/generated/go/gorm/references
    strategy: all
    opt:
      - target=gorm
      - stores=true
      - converters=true
      - filters=true
      - go_module=github.com/the-protobuf-project/store/examples/generated/go/gorm/references
      - config=examples/references/store.yaml

  - local: protoc-gen-store
    out: examples/generated/go/repository/references
    strategy: all
    opt:
      - target=repository
      - go_module=github.com/the-protobuf-project/store/examples/generated/go/repository/references
      - gorm_module=github.com/the-protobuf-project/store/examples/generated/go/gorm/references
      - config=examples/references/store.yaml

  - local: protoc-gen-store
    out: examples/generated/sql/references
    strategy: all
    opt:
      - target=sql
      - config=examples/references/store.yaml
